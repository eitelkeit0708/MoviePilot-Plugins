<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>115秒传助手 · 本地交互预览</title>
<link rel="icon" href="/logo.png"><link rel="stylesheet" href="/vendor/vuetify.css"><link rel="stylesheet" href="/vendor/mdi.css">
<script src="/vendor/vue.js"></script><script src="/vendor/vuetify.js"></script>
<style>body{margin:0;background:#151720;font-family:'Microsoft YaHei',sans-serif}.preview-shell{max-width:1440px;margin:auto}.preview-note{position:sticky;top:0;background:#252638;padding:6px 24px;font-size:12px;z-index:10}</style>
</head><body><div id="app"></div><script type="module">
// Load production federation artifacts, sharing Vue like MP V2.
const remote = await import('/assets/remoteEntry.js');
remote.init({vue:{[Vue.version]:{get:()=>()=>Vue,loaded:true}}});
const Page=(await remote.get('./Page'))(), Config=(await remote.get('./Config'))();
const {h,ref,createApp}=Vue;
const App={setup(){
 const requests=ref(0),screen=ref('page'),error=ref('');
 const api={post:async(path,body)=>{requests.value++;const r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error(r.status);return r.json();},
   get:async path=>{requests.value++;const r=await fetch('/api/'+path);if(!r.ok)throw Error(r.status);return r.json();}};
 return()=>h(Vuetify.components.VApp,{},()=>h('div',{class:'preview-shell'},[
  h('div',{class:'preview-note'},`本地预览 · 示例数据 · 请求 ${requests.value} 次${error.value}`),
  h(screen.value==='page'?Page:Config,{api,pluginId:'SymediaBatchBridge',onSwitch:()=>{screen.value=screen.value==='page'?'config':'page';},
    onSave:()=>{error.value=' · 预览不会保存配置';},onClose:()=>{error.value=' · 已点击关闭（预览保留）';}})
 ]));
}};
const app=createApp(App);app.use(Vuetify.createVuetify({theme:{defaultTheme:'dark',themes:{dark:{dark:true,colors:{background:'#151720',surface:'#1c202b',primary:'#ab8be8',warning:'#e1b65a',success:'#67c49a','on-surface':'#e5e6ed'}}}}}));app.mount('#app');
</script></body></html>
