<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>正式 UI 与 R2 对照</title>
<style>body{margin:0;background:#090c13;color:#e7e9ef;font:14px system-ui}header{display:flex;gap:16px;align-items:center;padding:10px 16px;height:48px;box-sizing:border-box}select{font:inherit;color:inherit;background:#171d2a;border:1px solid #404658;border-radius:4px}iframe{display:block;width:100%;height:calc(100vh - 48px);border:0;margin:auto}body[data-mobile=true] iframe{width:390px;height:844px;max-width:100%}</style></head>
<body><header><label>页面 <select id="page"><option value="index.html">正式组件（合成数据）</option><option value="study.html">R2 样板（合成数据）</option></select></label><label>尺寸 <select id="size"><option value="desktop">桌面</option><option value="mobile">390px</option></select></label></header><iframe title="界面对照" src="index.html"></iframe>
<script>document.querySelector('#page').addEventListener('change',event=>document.querySelector('iframe').src=event.target.value);document.querySelector('#size').addEventListener('change',event=>document.body.dataset.mobile=event.target.value==='mobile');</script></body></html>
