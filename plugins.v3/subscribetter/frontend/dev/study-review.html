<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>subscriBetter · 三场景审阅</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#080b11;color:#d9dce6;font:12px "Segoe UI","Microsoft YaHei",sans-serif}body{display:flex;flex-direction:column}header{height:44px;flex:none;display:flex;gap:10px;align-items:center;padding:0 18px;border-bottom:1px solid #ffffff1a}header strong{font-weight:500;margin-right:auto}button{font:inherit;background:transparent;border:1px solid #ffffff26;border-radius:5px;color:inherit;padding:5px 11px;cursor:pointer}button[aria-pressed=true]{background:#aa8af622;color:#bda4fc;border-color:#aa8af666}button:focus-visible{outline:2px solid #bda4fc;outline-offset:2px}main{flex:1;min-height:0;display:flex;justify-content:center;overflow:hidden}iframe{border:0;width:100%;height:100%;background:#10141e}iframe.phone{width:390px;max-width:100%;box-shadow:0 0 0 1px #ffffff20}small{color:#898e9e}
</style></head><body><header><strong>同一套界面 · 三场景设计审阅</strong><small id="size">桌面布局</small><button aria-pressed="true" id="desktop">桌面</button><button aria-pressed="false" id="phone">手机 390px</button></header><main><iframe src="./study.html" title="subscriBetter 交互样板"></iframe></main><script>
const frame=document.querySelector('iframe');for(const id of ['desktop','phone'])document.getElementById(id).onclick=()=>{frame.classList.toggle('phone',id==='phone');for(const key of ['desktop','phone'])document.getElementById(key).setAttribute('aria-pressed',String(key===id));document.getElementById('size').textContent=id==='phone'?'390px 嵌入视图 · 非真实手机':'桌面布局'};
</script></body></html>
